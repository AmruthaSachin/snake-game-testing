name: Node.js CI

on:
  push:
    branches:
      - main  # or master, depending on your default branch
  pull_request:
    branches:
      - main  # or master

jobs:
  build:
    runs-on: ubuntu-latest  # Use Ubuntu as the OS for the build

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '14'  # specify your desired node version

    - name: Install dependencies
      run: npm install  # Install your dependencies

    - name: Run tests
      run: npm test  # Run your tests (you can customize this based on your testing setup)
